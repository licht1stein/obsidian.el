name: "Emacs CI"
on:
  pull_request:
  push:
    branches:
      - main
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - 28.1
          - 29.4
          - 30.2
          - snapshot

    steps:
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - uses: actions/checkout@v7

      - name: Install Eldev
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/emacs-eldev/eldev/master/webinstall/github-eldev | sh

      - name: Install dependencies
        run: make prepare

      - name: Test
        run: make test
